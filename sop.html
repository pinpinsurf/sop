<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開盤 SOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8ECF0; --ink:#1B2431; --ink-2:#4A5563; --rule:#B7C0CA; --card:#F6F8FA;
  --up:#C8361E; --dn:#1E7A5A; --wait:#B7791F; --accent:#1B2431;
  --up-soft:#F6E1DC; --dn-soft:#DDEEE7; --wait-soft:#F5EAD3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A20; --ink:#E6EAEE; --ink-2:#98A3AF; --rule:#3A4450; --card:#1E252D;
    --up:#F0674F; --dn:#4FC59B; --wait:#E0A94A; --accent:#E6EAEE;
    --up-soft:#3A2521; --dn-soft:#1D3A30; --wait-soft:#3A3020;
  }
}
:root[data-theme="dark"]{
  --paper:#151A20; --ink:#E6EAEE; --ink-2:#98A3AF; --rule:#3A4450; --card:#1E252D;
  --up:#F0674F; --dn:#4FC59B; --wait:#E0A94A; --accent:#E6EAEE;
  --up-soft:#3A2521; --dn-soft:#1D3A30; --wait-soft:#3A3020;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 92px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top: clock + timeline */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 16px 8px}
.top-row{display:flex;justify-content:space-between;align-items:baseline}
.clock{font-size:28px;font-weight:900;letter-spacing:.02em}
.phase-name{font-size:14px;color:var(--ink-2)}
.timeline{position:relative;height:34px;margin-top:6px}
.timeline .bar{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule)}
.timeline .tick{position:absolute;top:4px;transform:translateX(-50%);font-size:11px;color:var(--ink-2);text-align:center;line-height:1}
.timeline .tick i{display:block;width:2px;height:14px;background:var(--rule);margin:0 auto 3px}
.timeline .now{position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transform:translateX(-50%);transition:left 1s linear}
.timeline .now.out{opacity:.25}

/* quick 3-box */
.quick{display:grid;grid-template-columns:auto 1.3fr 1fr 1fr;gap:6px;margin-top:8px;align-items:stretch}
.qdir{display:flex;flex-direction:column;gap:4px}
.qdir button{width:40px;flex:1;border-radius:8px;border:1.5px solid var(--rule);background:var(--card);font-weight:900;font-size:15px}
.qdir button.on.up{background:var(--up);border-color:var(--up);color:#fff}
.qdir button.on.dn{background:var(--dn);border-color:var(--dn);color:#fff}
.qbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--card);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.qbox span{font-size:11px;color:var(--ink-2)}
.qbox b{font-size:24px;font-weight:900;line-height:1.2}
.qbox.in{border-color:var(--ink)}
.qbox.in input{border:none;background:transparent;padding:0;font-size:24px;font-weight:900;width:100%;min-width:0;outline:none}
.qbox.sl{border-color:var(--dn);background:var(--dn-soft)} .qbox.sl b{color:var(--dn)}
.qbox.tp{border-color:var(--up);background:var(--up-soft)} .qbox.tp b{color:var(--up)}
/* price card */
.card{margin-top:8px;border:1.5px solid var(--rule);border-radius:12px;background:var(--card);padding:8px 12px;font-size:13px}
.card .row{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:center;padding:4px 0}
.card .row+.row{border-top:1px solid var(--rule)}
.card .row span{color:var(--ink-2)}
.card .row b{font-size:17px;font-weight:900}
.card .row.up b:first-of-type{color:var(--up)} .card .row.dn b:first-of-type{color:var(--dn)}
.card .hd{color:var(--ink-2);font-size:11px}
.card .box{display:flex;justify-content:space-between;color:var(--ink-2);padding:2px 0 4px}
.card .box b{color:var(--ink);font-size:15px}
.order{margin:10px 0;border:1.5px solid var(--rule);border-radius:12px;overflow:hidden}
.order .l{display:grid;grid-template-columns:1fr 1fr;padding:9px 12px;font-size:14px;border-bottom:1px solid var(--rule)}
.order .l:last-child{border-bottom:none}
.order .l span{color:var(--ink-2)}
.order .l b{font-size:18px;font-weight:900;text-align:right}
.order .l.h{background:var(--card);font-weight:700}
/* steps */
main{padding:12px 16px 40px;max-width:560px;margin:0 auto}
.step{border-top:2px solid var(--ink);padding:14px 0 18px}
.step.locked{opacity:.35;pointer-events:none;border-top-color:var(--rule)}
.step.done{border-top-color:var(--rule)}
.step h2{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--ink-2)}
.step h2 b{color:var(--ink);font-weight:900;font-size:15px;margin-right:8px}
.q{margin:14px 0 8px;font-size:17px;font-weight:700}
.q small{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 auto;min-width:45%;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);text-align:left;font-size:16px;line-height:1.35}
.opt:focus-visible{outline:3px solid var(--wait);outline-offset:2px}
.opt.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt.on.up{background:var(--up);border-color:var(--up);color:#fff}
.opt.on.dn{background:var(--dn);border-color:var(--dn);color:#fff}
.opt.on.stop{background:var(--wait);border-color:var(--wait);color:#1B2431}
.field{display:flex;align-items:center;gap:10px;margin:8px 0}
.field label{flex:0 0 96px;font-size:14px;color:var(--ink-2)}
.field input{flex:1;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);font-size:20px;font-weight:700;min-width:0}
.field input:focus{outline:none;border-color:var(--ink)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.calc div{padding:10px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--rule)}
.calc div span{display:block;font-size:12px;color:var(--ink-2)}
.calc div strong{font-size:24px;font-weight:900}
.calc .up{border-color:var(--up);background:var(--up-soft)} .calc .up strong{color:var(--up)}
.calc .dn{border-color:var(--dn);background:var(--dn-soft)} .calc .dn strong{color:var(--dn)}
.calc .wait{border-color:var(--wait);background:var(--wait-soft)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.check:last-of-type{border-bottom:none}
.check button{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);font-size:20px;font-weight:900}
.check button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check .t{flex:1;padding-top:8px}
.check .t small{display:block;color:var(--ink-2);font-size:13px}
.verdict{margin-top:14px;padding:14px 16px;border-radius:12px;font-weight:700;font-size:17px}
.verdict.go{background:var(--ink);color:var(--paper)}
.verdict.no{background:var(--wait-soft);border:1.5px solid var(--wait)}
.verdict.up{background:var(--up-soft);border:1.5px solid var(--up)}
.verdict.dn{background:var(--dn-soft);border:1.5px solid var(--dn)}
.note{margin-top:8px;font-size:14px;color:var(--ink-2)}
.next{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:none;background:var(--ink);color:var(--paper);font-size:17px;font-weight:700}
.next[disabled]{opacity:.3}
.next.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
textarea{width:100%;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);font:inherit;min-height:64px;resize:vertical}

/* records */
.rec{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.rec .d{color:var(--ink-2);font-size:13px}
.rec .p{font-weight:900;font-size:18px}
.rec .p.pos{color:var(--up)} .rec .p.neg{color:var(--dn)}
.rec .del{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--rule);background:transparent;color:var(--ink-2);font-size:18px;line-height:1}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);font-size:14px}
.summary{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:14px;color:var(--ink-2)}
.summary b{color:var(--ink);font-size:18px;font-weight:900}
.settings{margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}
.settings summary{cursor:pointer;font-size:14px;color:var(--ink-2)}
.settings .field input{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{color:var(--ink-2);font-size:14px;padding:12px 0}
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <div class="clock" id="clock">--:--</div>
    <div class="phase-name" id="phaseName">今天還沒開始</div>
  </div>
  <div class="timeline" id="timeline">
    <div class="bar"></div>
    <div class="now out" id="nowDot"></div>
  </div>
  <div class="quick" id="quick">
    <div class="qdir">
      <button id="qL" class="on up" onclick="qDir('L')">多</button>
      <button id="qS" class="dn" onclick="qDir('S')">空</button>
    </div>
    <div class="qbox in"><span>成交價</span><input id="qFill" inputmode="decimal" placeholder="填這裡" oninput="qCalc()"></div>
    <div class="qbox sl"><span>停損</span><b id="qSL">—</b></div>
    <div class="qbox tp"><span>停利</span><b id="qTP">—</b></div>
  </div>
  <div id="card"></div>
</div>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- settings & state ---------- */
const DEF = {bufL:20, bufS:20, stop:50, tp:80, pt:10, cost:55, closeAt:"10:00", lastEntry:"09:45"};
let S = load("sop.settings", DEF);
let T = load("sop.today", null) || fresh();
let R = load("sop.records", []);

function fresh(){
  const d = new Date(); const ds = d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
  return {date:ds, step:0, a:{}};   // a = answers
}
function p2(n){return String(n).padStart(2,"0")}
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(){try{localStorage.setItem("sop.today",JSON.stringify(T));localStorage.setItem("sop.records",JSON.stringify(R));localStorage.setItem("sop.settings",JSON.stringify(S))}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function n(v){const x=parseFloat(v);return isNaN(x)?null:x}

/* ---------- clock & timeline ---------- */
const TICKS=[["08:45",0],["09:10",25],["09:15",30],["09:45",60],["10:00",75]];
(function buildTimeline(){
  const tl=document.getElementById("timeline");
  TICKS.forEach(([t,m])=>{const e=document.createElement("div");e.className="tick";e.style.left=(m/75*100)+"%";e.innerHTML="<i></i>"+t;tl.appendChild(e)});
})();
function tick(){
  const d=new Date(), hh=d.getHours(), mm=d.getMinutes();
  document.getElementById("clock").textContent=p2(hh)+":"+p2(mm);
  const mins=(hh*60+mm)-(8*60+45);
  const dot=document.getElementById("nowDot");
  if(mins<0||mins>75){dot.classList.add("out");dot.style.left=(mins<0?0:100)+"%"}
  else{dot.classList.remove("out");dot.style.left=(mins/75*100)+"%"}
  const names=[[0,"開盤，看盤不動手"],[25,"跳空日：畫 08:45–09:10 箱型"],[30,"等出箱，出箱才決定"],[60,"未成交就撤單"],[75,"強制平倉"]];
  let name="不在交易時段";
  if(mins>=0&&mins<=75){for(const [m,nm] of names){if(mins>=m)name=nm}}
  else if(mins<0&&mins>-120)name="開盤前，先做前置確認";
  document.getElementById("phaseName").textContent=name;
}
tick(); setInterval(tick,15000);

/* ---------- helpers for rendering ---------- */
const A=()=>T.a;
function box(){ // returns {hi,lo,src}
  const a=A();
  if(a.gap==="yes"&&n(a.gHi)!=null&&n(a.gLo)!=null) return {hi:n(a.gHi),lo:n(a.gLo),src:"08:45–09:10 高低"};
  if(n(a.yHi)!=null&&n(a.yLo)!=null) return {hi:n(a.yHi),lo:n(a.yLo),src:"昨日日盤高低"};
  return null;
}
function triggers(){
  const b=box(); if(!b) return null;
  const L=b.hi+S.bufL, Sh=b.lo-S.bufS;
  return {L,Sh,noteL:"",noteS:"",box:b};
}
function opt(key,val,label,cls){
  const on=A()[key]===val;
  return `<button class="opt ${on?"on":""} ${cls||""}" onclick="ans('${key}','${val}')">${label}</button>`;
}
function fld(key,label,ph){
  const v=A()[key]??"";
  return `<div class="field"><label>${label}</label><input inputmode="decimal" placeholder="${ph||""}" value="${v}" oninput="T.a['${key}']=this.value;save()" onblur="render()"></div>`;
}
function chk(key,label,sub){
  const on=!!A()[key];
  return `<div class="check"><button class="${on?"on":""}" onclick="tog('${key}')" aria-pressed="${on}">${on?"✓":""}</button><div class="t">${label}${sub?`<small>${sub}</small>`:""}</div></div>`;
}
function ans(k,v){T.a[k]=v;save();render()}
function tog(k){T.a[k]=!T.a[k];save();render()}
function go(s){T.step=s;save();render();setTimeout(()=>{const el=document.getElementById("s"+s);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})},50)}

function levels(){
  const tr=triggers(); if(!tr) return null;
  const a=A(); const f=n(a.fill); const dir=a.dir;
  const tg=n(a.trig);
  const L=(dir==="L"&&f!=null)?f:(dir==="L"&&tg!=null?tg:tr.L), Sh=(dir==="S"&&f!=null)?f:(dir==="S"&&tg!=null?tg:tr.Sh);
  return {box:tr.box, L, Sh, LSL:L-S.stop, LTP:L+S.tp, SSL:Sh+S.stop, STP:Sh-S.tp, filled:(dir==="L"||dir==="S")&&f!=null, dir, noteL:tr.noteL, noteS:tr.noteS};
}
function card(){
  const v=levels(); const el=document.getElementById("card");
  if(!v){el.innerHTML="";return}
  const lab=v.filled?"成交價":"觸價";
  el.innerHTML=`<div class="card">
    <div class="box"><span>箱型 ${v.box.src}</span><b>${v.box.lo} – ${v.box.hi}</b><span>${v.box.hi-v.box.lo} 點</span></div>
    <div class="row hd"><span></span><span>${lab}</span><span>停損</span><span>停利</span></div>
    ${(!v.filled||v.dir==="L")?`<div class="row up"><span>多</span><b>${v.L}</b><b>${v.LSL}</b><b>${v.LTP}</b></div>`:""}
    ${(!v.filled||v.dir==="S")?`<div class="row dn"><span>空</span><b>${v.Sh}</b><b>${v.SSL}</b><b>${v.STP}</b></div>`:""}
  </div>`;
}

/* ---------- quick calc ---------- */
let Q=load("sop.quick",{dir:"L",fill:""});
function qDir(d){Q.dir=d;qCalc()}
function qCalc(){
  const inp=document.getElementById("qFill"); Q.fill=inp.value;
  try{localStorage.setItem("sop.quick",JSON.stringify(Q))}catch(e){}
  document.getElementById("qL").classList.toggle("on",Q.dir==="L");
  document.getElementById("qS").classList.toggle("on",Q.dir==="S");
  const f=n(Q.fill);
  document.getElementById("qSL").textContent=f==null?"—":(Q.dir==="L"?f-S.stop:f+S.stop);
  document.getElementById("qTP").textContent=f==null?"—":(Q.dir==="L"?f+S.tp:f-S.tp);
}
(function qInit(){document.getElementById("qFill").value=Q.fill||"";qCalc()})();

/* ---------- steps ---------- */
function step0(){ // 前置
  const a=A();
  const ok=n(a.yHi)!=null&&n(a.yLo)!=null&&a.canWatch&&a.margin&&a.flat&&a.oneLot;
  return `
  <div class="step" id="s0">
    <h2><b>前置</b>08:45 之前</h2>
    <div class="field"><label>日期</label><input type="date" value="${T.date}" onchange="T.date=this.value;save()"></div>
    <div class="q">昨天日盤的高低<small>只看日盤，不含夜盤</small></div>
    ${fld("yHi","昨日高","例如 48108")}
    ${fld("yLo","昨日低","例如 47775")}
    <div class="q">今天的條件</div>
    ${chk("canWatch","今天能看盤到 10:00","看不到就不做，沒有例外")}
    ${chk("margin","保證金足額","不用當沖減半")}
    ${chk("flat","現在是空手","沒有留倉、沒有掛著的保護單")}
    ${chk("oneLot","今天只做一口、只做一次","第一次突破真假，賭一次")}
    <button class="next" ${ok?"":"disabled"} onclick="go(1)">前置完成，等 08:45</button>
  </div>`;
}
function step1(){ // 08:45 讀盤
  const a=A(); const hi=n(a.yHi), lo=n(a.yLo), o=n(a.open845);
  let gapAuto=null;
  if(o!=null&&hi!=null&&lo!=null) gapAuto=(o>hi||o<lo)?"yes":"no";
  const gap=a.gap||gapAuto;
  if(gap&&!a.gap){T.a.gap=gap;save()}
  const needG=gap==="yes";
  const gOk=!needG||(n(a.gHi)!=null&&n(a.gLo)!=null);
  const ok=o!=null&&a.shape&&a.vol&&gOk;
  return `
  <div class="step ${T.step<1?"locked":""} ${T.step>1?"done":""}" id="s1">
    <h2><b>讀盤</b>08:45 起，只看不動手</h2>
    ${fld("open845","08:45 開盤價","現在的價")}
    ${o!=null&&hi!=null?`<div class="calc"><div class="${gapAuto==="yes"?"wait":""}"><span>跟昨日箱型比</span><strong>${gapAuto==="yes"?"跳空":"在箱型內"}</strong></div><div><span>昨日箱型</span><strong>${lo}–${hi}</strong></div></div>`:""}
    <div class="q">跳空嗎？<small>開盤在昨日高低之外就是跳空，箱型改用 08:45–09:10 的高低</small></div>
    <div class="opts">${opt("gap","no","沒有，用昨日箱型")}${opt("gap","yes","跳空，等 09:10 畫新箱型","stop")}</div>
    ${needG?`<div class="q">09:10 到了，這 25 分鐘的高低</div>${fld("gHi","09:10 前高")}${fld("gLo","09:10 前低")}`:""}
    <div class="q">這 30 分鐘走出來的樣子</div>
    <div class="opts">${opt("shape","dir","有方向，往一邊試")}${opt("shape","chop","來回盤整","stop")}${opt("shape","reverse","先衝再反轉")}</div>
    <div class="q">量和波動</div>
    <div class="opts">${opt("vol","ok","夠，K 棒有實體")}${opt("vol","thin","太薄、太小","stop")}</div>
    <button class="next" ${ok?"":"disabled"} onclick="go(2)">箱型定案，去備單</button>
  </div>`;
}
function step2(){ // 單子備好，等出箱
  const a=A(); const tr=triggers(); if(!tr)return "";
  const flags=[];
  if(a.shape==="chop")flags.push("盤整盤，你的規則是不做");
  if(a.vol==="thin")flags.push("量太薄，突破不容易是真的");
  return `
  <div class="step ${T.step<2?"locked":""} ${T.step>2?"done":""}" id="s2">
    <h2><b>備單</b>箱型定案，單子算好、先不送</h2>
    <div class="calc"><div><span>箱型（${tr.box.src}）</span><strong>${tr.box.lo}–${tr.box.hi}</strong></div><div><span>寬度</span><strong>${tr.box.hi-tr.box.lo} 點</strong></div></div>
    <div class="calc">
      <div class="up"><span>多方觸價（箱頂 +${S.bufL}）</span><strong>${tr.L}</strong><span>停損 ${tr.L-S.stop}　停利 ${tr.L+S.tp}</span></div>
      <div class="dn"><span>空方觸價（箱底 −${S.bufS}）</span><strong>${tr.Sh}</strong><span>停損 ${tr.Sh+S.stop}　停利 ${tr.Sh-S.tp}</span></div>
    </div>
    ${flags.length?`<div class="verdict no">${flags.join("<br>")}<br>可以先備好，但出箱時要記得這個。</div>`:`<div class="note">讀盤沒有紅旗。現在只等一件事：價格出箱。往上過 ${tr.box.hi} 或往下破 ${tr.box.lo}，那一刻回來這裡。</div>`}
    <div class="note">${a.gap==="yes"?"跳空日：09:10 箱型畫好之後出箱才算":"不跳空：09:15 之後出箱才算"}，${S.lastEntry} 之後出箱不做。</div>
    <button class="next" onclick="go(3)">價格出箱了</button>
    <button class="next ghost" onclick="ans('decide','skip');go(3)">還沒出箱，但今天想收工</button>
  </div>`;
}
function step3(){ // 出箱 → 決定
  const a=A(); const tr=triggers(); if(!tr)return "";
  const earliest=a.gap==="yes"?"09:10":"09:15";
  const t=a.bkTime||""; let tFlag="";
  if(t){ if(t<earliest)tFlag="出箱時間早於 "+earliest+"，箱型還沒算數"; else if(t>S.lastEntry)tFlag="出箱時間晚於 "+S.lastEntry+"，規則是不做"; }
  const side=a.bkSide; const cur=n(a.bkPx);
  let trig=null,noteT="";
  if(side==="L"){trig=tr.L; if(cur!=null&&cur>tr.L){trig=cur+S.bufL;noteT="已經超過觸價，改掛現價 +"+S.bufL}}
  if(side==="S"){trig=tr.Sh; if(cur!=null&&cur<tr.Sh){trig=cur-S.bufS;noteT="已經跌破觸價，改掛現價 −"+S.bufS}}
  if(trig!=null&&T.a.trig!==trig){T.a.trig=trig;save()}
  const eyesDone=a.q1&&a.q2&&a.q3;
  const skipping=a.decide==="skip";
  return `
  <div class="step ${T.step<3?"locked":""} ${T.step>3?"done":""}" id="s3">
    <h2><b>出箱</b>這一刻才決定做不做</h2>
    ${skipping?"":`
    <div class="q">哪一邊出箱？</div>
    <div class="opts">${opt("bkSide","L","往上過箱頂 "+tr.box.hi,"up")}${opt("bkSide","S","往下破箱底 "+tr.box.lo,"dn")}</div>
    <div class="field"><label>出箱時間</label><input type="time" value="${t}" onchange="ans('bkTime',this.value)"></div>
    ${fld("bkPx","現在的價")}
    ${tFlag?`<div class="verdict no">${tFlag}</div>`:""}
    ${side?`<div class="calc"><div class="${side==="L"?"up":"dn"}"><span>要掛的觸價${noteT?"　"+noteT:""}</span><strong>${trig}</strong></div><div><span>打到才進場</span><strong>${side==="L"?"多":"空"} 1 口</strong></div></div>`:""}
    <div class="q">出箱那一刻，你的眼睛看到什麼<small>只記錄，不擋你。之後拿這三題對照結果。</small></div>
    <div class="opts">${opt("q1","y","K 棒有實體")}${opt("q1","n","影線多、實體小","stop")}</div>
    <div class="opts">${opt("q2","y","量有出來")}${opt("q2","n","量沒跟上","stop")}</div>
    <div class="opts">${opt("q3","y","沒有馬上縮回箱內")}${opt("q3","n","一出去就縮回來","stop")}</div>
    `}
    <div class="q">做不做？<small>一天只賭第一次出箱。選不做，今天就結束。</small></div>
    <div class="opts">${opt("decide","go","做")}${opt("decide","skip","今天不做","stop")}</div>
    ${skipping?`<div class="q">不做的理由屬於哪一類</div>
    <div class="opts">${opt("skipType","chop","盤整")}${opt("skipType","thin","量薄")}${opt("skipType","late","出箱時間不在窗內")}${opt("skipType","fake","看起來是假的")}${opt("skipType","nowatch","看不到 10:00")}${opt("skipType","outside","規則外：心情、昨天賠了、沒把握","stop")}</div>
    ${a.skipType==="outside"?`<div class="verdict no">這是偏離，只是方向是不做。照樣記，之後要算的。</div>`:""}
    <div class="q">多寫一句<small>之後要對照的是這句</small></div><textarea onchange="ans('skipWhy',this.value)">${a.skipWhy||""}</textarea><button class="next" ${a.skipType?"":"disabled"} onclick="finishSkip()">記錄「今天不做」，結束</button>`:""}
    ${a.decide==="go"?`<button class="next" ${side&&eyesDone&&trig!=null?"":"disabled"} onclick="T.a.dir=T.a.bkSide;save();go(4)">送觸價單</button>`:""}
  </div>`;
}
function step4(){ // 送單 → 成交價 → 停損停利
  const a=A(); const dir=a.dir; const trig=n(a.trig); if(!dir||trig==null)return "";
  const f=n(a.fill);
  const base=f!=null?f:trig;
  const sl=dir==="L"?base-S.stop:base+S.stop;
  const tp=dir==="L"?base+S.tp:base-S.tp;
  const diff=f!=null?f-trig:0;
  const ok=a.sent&&a.oco&&a.timeClose&&(f!=null||a.fillNone);
  return `
  <div class="step ${T.step<4?"locked":""} ${T.step>4?"done":""}" id="s4">
    <h2><b>送單</b>${dir==="L"?"多":"空"}單，一口，照順序</h2>
    <div class="order">
      <div class="l h"><span>觸價單</span><b>${dir==="L"?"買進":"賣出"} 1 口</b></div>
      <div class="l"><span>觸發價</span><b>${trig}</b></div>
      <div class="l"><span>委託</span><b>市價</b></div>
    </div>
    ${chk("sent","觸價單送出了","打到才進，不追")}
    <div class="verdict ${dir==="L"?"up":"dn"}">送出後馬上設停損停利，成交就跟著出去</div>
    ${fld("fill","成交價","還沒成交就先用觸價 "+trig)}
    ${f!=null&&Math.abs(diff)>=10?`<div class="note">成交價和觸價差 ${diff>0?"+":""}${diff} 點，下面的停損停利已經用成交價重算。如果二擇一單已經照觸價送了，改一下。</div>`:""}
    <div class="calc"><div class="dn"><span>停損</span><strong>${sl}</strong></div><div class="up"><span>停利</span><strong>${tp}</strong></div></div>
    <div class="order">
      <div class="l h"><span>智能單：二擇一（OCO）</span><b>${dir==="L"?"賣出":"買進"} 1 口</b></div>
      <div class="l"><span>停損 觸發價</span><b>${sl}</b></div>
      <div class="l"><span>停損 委託</span><b>市價</b></div>
      <div class="l"><span>停利 觸發價</span><b>${tp}</b></div>
      <div class="l"><span>停利 委託</span><b>市價</b></div>
      <div class="l"><span>平倉</span><b>勾</b></div>
    </div>
    ${chk("oco","二擇一單照上面設好、送出","一邊觸發另一邊自動撤")}
    <div class="order">
      <div class="l h"><span>智能單：時間單</span><b>${dir==="L"?"賣出":"買進"} 1 口</b></div>
      <div class="l"><span>觸發時間</span><b>${S.closeAt}</b></div>
      <div class="l"><span>委託</span><b>市價</b></div>
      <div class="l"><span>平倉</span><b>勾</b></div>
    </div>
    ${chk("timeClose","時間單照上面設好、送出","10:00 還在場上就會被它帶走")}
    <div class="q">成交了嗎？</div>
    <div class="opts"><button class="opt ${f!=null&&!a.fillNone?"on":""}" onclick="ans('fillNone',false)">成交了，成交價填在上面</button>${opt("fillNone",true,S.lastEntry+" 前沒打到","stop")}</div>
    ${a.fillNone?`${chk("cxlAll","觸價單和保護單都撤掉了")}<button class="next" ${a.cxlAll?"":"disabled"} onclick="finishNoFill()">記錄「送了沒成交」，結束</button>`:""}
    ${!a.fillNone?`<button class="next" ${ok?"":"disabled"} onclick="go(5)">都設好了，等出場</button>`:""}
  </div>`;
}
function step5(){ // 出場
  const a=A(); const dir=a.dir; const f=n(a.fill); const x=n(a.exit);
  const pts=(f!=null&&x!=null)?(dir==="L"?x-f:f-x):null;
  const net=pts!=null?pts*S.pt-S.cost:null;
  const ok=a.how&&x!=null&&a.disc;
  return `
  <div class="step ${T.step<5?"locked":""}" id="s5">
    <h2><b>出場</b>${S.closeAt} 之前一定會發生</h2>
    <div class="q">怎麼出的？</div>
    <div class="opts">${opt("how","sl","停損")}${opt("how","tp","停利")}${opt("how","time",S.closeAt+" 時間平倉")}${opt("how","manual","手動出場","stop")}</div>
    ${a.how==="manual"?`<div class="verdict no">手動出場不在規則裡。先記下來為什麼，這一筆之後要單獨看。</div><textarea placeholder="為什麼手動" onchange="ans('manualWhy',this.value)">${a.manualWhy||""}</textarea>`:""}
    ${fld("exit","出場價")}
    ${pts!=null?`<div class="calc"><div class="${pts>=0?"up":"dn"}"><span>點數</span><strong>${pts>0?"+":""}${pts}</strong></div><div class="${net>=0?"up":"dn"}"><span>扣成本 ${S.cost} 元</span><strong>${net>0?"+":""}${net} 元</strong></div></div>`:""}
    <div class="q">執行檢查<small>不是問賺賠，是問有沒有照做</small></div>
    <div class="opts">${opt("disc","yes","每一步都照規則")}${opt("disc","no","有一步偏掉","stop")}</div>
    ${a.disc==="no"?`<textarea placeholder="哪一步、為什麼" onchange="ans('discNote',this.value)">${a.discNote||""}</textarea>`:""}
    <textarea placeholder="今天想留一句給之後的自己（可空）" onchange="ans('memo',this.value)">${a.memo||""}</textarea>
    <button class="next" ${ok?"":"disabled"} onclick="finishTrade()">存這一筆</button>
  </div>`;
}

function records(){
  const t=R.filter(r=>r.kind==="trade");
  const net=t.reduce((s,r)=>s+(r.net||0),0), wins=t.filter(r=>r.pts>0).length;
  const skipsIn=R.filter(r=>r.kind==="skip"&&r.skipType!=="outside").length, skipsOut=R.filter(r=>r.kind==="skip"&&r.skipType==="outside").length, nofill=R.filter(r=>r.kind==="nofill").length;
  const disc=t.filter(r=>r.disc==="yes").length;
  const rows=R.map((r,i)=>({r,i})).reverse().slice(0,60).map(({r,i})=>{
    let mid, p="";
    if(r.kind==="trade"){mid=`${r.dir==="L"?"多":"空"} ${r.fill}→${r.exit}　${{sl:"停損",tp:"停利",time:"時間",manual:"手動"}[r.how]||""}${r.disc==="no"?"　偏離":""}`;p=`<div class="p ${r.net>=0?"pos":"neg"}">${r.net>0?"+":""}${r.net}</div>`}
    else if(r.kind==="skip"){const tl={chop:"盤整",thin:"量薄",late:"時間外",fake:"看起來假",nowatch:"看不到10:00",outside:"規則外"}[r.skipType]||"";mid=`不做${tl?"（"+tl+"）":""}${r.bkSide?"　出箱"+(r.bkSide==="L"?"上":"下")+(r.bkTime?" "+r.bkTime:""):""}${r.why?"：" +r.why:""}`}
    else {mid=`送了沒成交${r.bkSide?"　"+(r.bkSide==="L"?"多":"空")+" "+(r.trig||""):""}`}
    return `<div class="rec"><div class="d">${(r.date||"").slice(5)}</div><div>${mid}</div>${p||"<div></div>"}<button class="del" onclick="delRec(${i})" aria-label="刪除這筆">×</button></div>`;
  }).join("");
  return `
  <div class="step" id="recs" style="margin-top:28px">
    <h2><b>紀錄</b>${R.length} 天</h2>
    <div class="summary"><div>進場 <b>${t.length}</b></div><div>勝率 <b>${t.length?Math.round(wins/t.length*100):0}%</b></div><div>淨損益 <b>${net>0?"+":""}${net}</b> 元</div><div>照規則 <b>${t.length?Math.round(disc/t.length*100):0}%</b></div><div>不做·規則內 <b>${skipsIn}</b></div><div>不做·規則外 <b>${skipsOut}</b></div><div>沒成交 <b>${nofill}</b></div></div>
    ${rows||`<div class="empty">還沒有紀錄。第一筆從上面開始。</div>`}
    <div class="tools">
      <button onclick="exportJSON()">匯出 JSON</button>
      <button onclick="document.getElementById('imp').click()">匯入 JSON</button>
      <button onclick="resetToday()">清掉今天重來</button>
    </div>
    <input id="imp" type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])">
    <details class="settings"><summary>參數（現在：多 +${S.bufL}／空 −${S.bufS}、停損 ${S.stop}、停利 ${S.tp}、一點 ${S.pt} 元、成本 ${S.cost} 元）</summary>
      ${[["bufL","多方緩衝"],["bufS","空方緩衝"],["stop","停損點數"],["tp","停利點數"],["pt","每點金額"],["cost","來回成本(元)"]].map(([k,l])=>`<div class="field"><label>${l}</label><input inputmode="decimal" value="${S[k]}" onchange="S['${k}']=parseFloat(this.value)||0;save();render()"></div>`).join("")}
      <div class="note">改參數等於改系統。回測定案之前不要在這裡動。</div>
    </details>
  </div>`;
}

/* ---------- finishing ---------- */
function finishSkip(){const a=A();R.push({kind:"skip",date:T.date,why:a.skipWhy||"",skipType:a.skipType||"",shape:a.shape,vol:a.vol,gap:a.gap,bkSide:a.bkSide,bkTime:a.bkTime,q1:a.q1,q2:a.q2,q3:a.q3});T=fresh();save();render();toast("已記錄：今天不做")}
function finishNoFill(){const a=A();R.push({kind:"nofill",date:T.date,gap:a.gap,box:box(),bkSide:a.bkSide,bkTime:a.bkTime,trig:n(a.trig),q1:a.q1,q2:a.q2,q3:a.q3});T=fresh();save();render();toast("已記錄：沒成交")}
function finishTrade(){
  const a=A(); const f=n(a.fill), x=n(a.exit); const pts=a.dir==="L"?x-f:f-x;
  R.push({kind:"trade",date:T.date,dir:a.dir,fill:f,exit:x,pts:pts,net:pts*S.pt-S.cost,how:a.how,disc:a.disc,discNote:a.discNote||"",manualWhy:a.manualWhy||"",memo:a.memo||"",gap:a.gap,box:box(),bkTime:a.bkTime,trig:n(a.trig),q1:a.q1,q2:a.q2,q3:a.q3,params:{...S}});
  T=fresh();save();render();toast("存好了");
}
function delRec(i){const r=R[i];if(!r)return;if(confirm("刪掉 "+(r.date||"")+" 這一筆？"))R.splice(i,1);save();render()}
function resetToday(){if(confirm("清掉今天填的內容？紀錄不會動。")){T=fresh();save();render()}}
function exportJSON(){
  const blob=new Blob([JSON.stringify({records:R,settings:S,exported:new Date().toISOString()},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sop-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  toast("如果沒跳下載，長按上方標題另存");
}
function importJSON(file){
  if(!file)return; const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);const arr=Array.isArray(j)?j:(j.records||j.trades||[]);
    let added=0;arr.forEach(r=>{if(r&&typeof r==="object"){if(!r.kind)r.kind=r.dir?"trade":"skip";R.push(r);added++}});
    save();render();toast("匯入 "+added+" 筆")}catch(e){toast("讀不了這個檔")}};
  rd.readAsText(file);
}

/* ---------- render ---------- */
function render(){
  document.getElementById("app").innerHTML=step0()+step1()+step2()+step3()+step4()+step5()+records();
  card();
}
render();
</script>
</body>
</html>
