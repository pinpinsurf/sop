<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="突破SOP">
<meta name="theme-color" content="#D9DCD6">
<title>開盤突破 SOP</title>
<style>
:root{--panel:#D9DCD6;--paper:#E6E8E2;--ink:#141A1F;--slate:#2E4756;--mute:#7C8479;
--line:#B9BEB4;--up:#C0392B;--down:#1E7B4F;--warn:#A8621B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--panel)}
body{color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Hiragino Sans",system-ui,sans-serif;
padding:env(safe-area-inset-top) 0 calc(48px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.top{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:14px;height:34px;background:var(--slate);flex:none}
.btitle{font-family:"Noto Serif TC","Songti TC",serif;font-size:21px;font-weight:600;letter-spacing:.04em}
.bsub{font-size:11.5px;color:var(--mute);letter-spacing:.06em;margin-top:2px}
.tabs{display:flex;gap:6px;margin-top:14px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:13px;font-family:inherit;letter-spacing:.1em;cursor:pointer}
.tab.on{background:var(--slate);border-color:var(--slate);color:var(--paper)}
.err{margin:12px 18px;padding:10px 12px;border-left:3px solid var(--up);background:#0000000d;font-size:13px}
.nag{margin:12px 18px;padding:11px 13px;border-left:3px solid var(--warn);background:#a8621b14;font-size:13px;line-height:1.6;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nag button{border:1px solid var(--warn);background:transparent;color:var(--warn);font-family:inherit;font-size:13px;padding:7px 12px;cursor:pointer;flex:none}
.dlrow{display:flex;gap:8px;margin-top:8px}
.dlrow button{flex:1}
main{padding:16px 18px}
.gates{display:flex;list-style:none;padding:0;margin:0 0 18px;gap:3px}
.gate{flex:1;text-align:center;padding:6px 0 5px;border-top:2px solid var(--line);color:var(--mute);font-size:9.5px}
.gate .gnum{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.gate.done{border-top-color:var(--slate);color:var(--slate);cursor:pointer}
.gate.now{border-top-color:var(--ink);color:var(--ink);font-weight:600}
.card,.panel{background:var(--paper);border:1px solid var(--line);padding:20px 18px;margin-bottom:14px;position:relative}
.panel.accent{border-left:3px solid var(--slate)}
.ck{position:absolute;top:14px;right:16px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--line)}
.card h2{font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;margin:0 0 6px;letter-spacing:.03em}
.card .sub{margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--mute)}
.ptitle{font-size:11px;letter-spacing:.16em;color:var(--mute);margin-bottom:14px}
.pnote{font-size:12.5px;line-height:1.7;color:var(--mute);margin:-6px 0 14px}
.sechead{font-size:11px;letter-spacing:.12em;color:var(--mute);margin:6px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px}.row .field{flex:1}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:11px;letter-spacing:.1em;color:var(--mute);margin-bottom:5px}
input,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-family:ui-monospace,Menlo,monospace;border-radius:0;-webkit-appearance:none}
textarea{font-family:inherit;font-size:15px;line-height:1.6}
input:focus,textarea:focus{outline:2px solid var(--slate);outline-offset:-2px}
input.big{font-size:26px;padding:12px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 0;border:0;background:transparent;font-family:inherit;font-size:14px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--slate);color:var(--paper)}
.verdict{padding:11px 13px;font-size:13px;line-height:1.6;margin-bottom:14px;border-left:3px solid}
.verdict.pass{border-color:var(--down);background:#1e7b4f14}
.verdict.fail{border-color:var(--warn);background:#a8621b14}
.clock{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute)}
.clock .bar{flex:1;height:2px;background:linear-gradient(90deg,var(--slate),var(--line))}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{text-align:left;padding:13px 15px;border:1px solid var(--line);background:var(--panel);font-family:inherit;cursor:pointer;width:100%;color:var(--ink)}
.ch b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.ch em{font-style:normal;font-size:12px;color:var(--mute)}
.ch.warn{border-style:dashed;border-color:var(--warn)}.ch.warn b{color:var(--warn)}
.edges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edg{padding:12px 10px;border:1px solid var(--line);background:var(--panel);font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
.edg b{display:block;font-size:14px;margin-bottom:3px}
.edg em{font-style:normal;font-size:12px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
.edg.on.long{background:var(--up);border-color:var(--up);color:#fff}
.edg.on.short{background:var(--down);border-color:var(--down);color:#fff}
.edg.on em{color:#ffffffcc}
.tag{font-size:13px;letter-spacing:.08em;color:var(--slate);margin:12px 0 4px}
.note{font-size:12.5px;color:var(--mute);margin:-6px 0 14px;line-height:1.6}
.note.alarm{color:var(--warn)}
.checklist{border:1px solid var(--line);padding:12px;margin-bottom:16px}
.cltitle{font-size:11px;letter-spacing:.12em;color:var(--mute);margin-bottom:9px}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 0;border:0;background:transparent;font-family:inherit;font-size:14px;color:var(--mute);cursor:pointer;line-height:1.5}
.chk .box{width:18px;height:18px;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.chk.on{color:var(--ink)}
.chk.on .box{background:var(--slate);border-color:var(--slate);color:var(--paper)}
.prices{display:flex;gap:8px;margin-bottom:14px}
.pz{flex:1;padding:11px;border:1px solid var(--line);text-align:center}
.pz span{display:block;font-size:10.5px;color:var(--mute);margin-bottom:4px}
.pz b{font-size:17px}
.pz.stop{border-color:var(--warn)}.pz.take{border-color:var(--down)}
.math{border:1px solid var(--line);padding:4px 12px;margin-bottom:16px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.mrow:last-child{border-bottom:0}
.mrow span{color:var(--mute)}
.mrow.big b{font-size:22px;color:var(--slate)}
.locks{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lock{display:flex;gap:11px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--panel);font-family:inherit;font-size:14px;color:var(--mute);cursor:pointer;text-align:left;width:100%}
.lock.on{color:var(--ink);border-color:var(--slate)}
.lock.on .lk{color:var(--slate)}
.exits{display:flex;flex-direction:column;gap:6px}
.ex{padding:12px;border:1px solid var(--line);background:var(--panel);font-family:inherit;font-size:14px;cursor:pointer;width:100%;color:var(--ink)}
.ex.on{background:var(--slate);color:var(--paper);border-color:var(--slate)}
.exbox{display:flex;gap:8px;margin-bottom:16px}
.exc{flex:1;border:1px solid var(--line);padding:12px;text-align:center}
.exc span{display:block;font-size:10.5px;color:var(--mute);margin-bottom:5px}
.exc b{font-size:20px}
.exc b.up{color:var(--down)}.exc b.down{color:var(--up)}
.inline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);margin-bottom:14px}
.inline input{width:auto}
.scorebox{display:flex;gap:10px;margin-bottom:16px}
.sc{flex:1;border:1px solid var(--line);padding:16px;text-align:center}
.sc span{display:block;font-size:11px;color:var(--mute);letter-spacing:.1em;margin-bottom:6px}
.sc b{font-size:34px;font-family:"Noto Serif TC",serif;display:block}
.sc b.full{color:var(--slate)}.sc b.cut{color:var(--warn)}
.sc b.result{font-size:26px;font-family:ui-monospace,Menlo,monospace;color:var(--mute)}
.viols{margin-bottom:14px}
.vi{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--warn)}
.vi span{font-family:ui-monospace,Menlo,monospace}
.rows{margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv span{color:var(--mute)}
.kv b{text-align:right;white-space:nowrap}
.bigstat{display:flex;align-items:baseline;gap:9px;margin-bottom:16px}
.bigstat b{font-size:52px;font-family:"Noto Serif TC",serif;line-height:1;color:var(--slate)}
.bigstat span{font-size:12px;color:var(--mute)}
.grid80{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:12px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:transparent}
.cell.skip{background:var(--slate);border-color:var(--slate)}
.cell.win{background:var(--up);border-color:var(--up)}
.cell.loss{background:var(--down);border-color:var(--down)}
.cell.broke{outline:2px solid var(--warn);outline-offset:-1px;opacity:.5}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);flex-wrap:wrap}
.legend i{width:11px;height:11px;display:inline-block;margin-left:8px}
.primary{width:100%;padding:15px;border:0;background:var(--ink);color:var(--paper);font-family:inherit;font-size:15px;letter-spacing:.05em;cursor:pointer}
.primary:active{background:var(--slate)}
.ghost{width:100%;padding:13px;border:1px solid var(--up);background:transparent;color:var(--up);font-family:inherit;font-size:14px;cursor:pointer;margin-top:8px}
.soft{width:100%;padding:13px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer;margin-top:8px}
.panel.danger{border-color:#c0392b40}
button:focus-visible,input:focus-visible{outline:2px solid var(--slate);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

var KEY = "breakout-sop-v2";

var DEFAULTS = {
  contract: "小台", pointValue: 50, atrMin: 50,
  slPoints: 60, tpPoints: 100, costPerRound: 100,
  target: 80, timeStopMode: "智能單",
  lastBackup: null, lastBackupN: 0
};

var PENALTY = {
  noSL:{p:40,label:"沒設停損單"}, noTP:{p:20,label:"沒設停利單"},
  noTimeStop:{p:25,label:"沒設 10:00 平倉"}, lateEntry:{p:30,label:"09:20 之後才進場"},
  wideSL:{p:30,label:"停損放超過設定點數"}, notFirst:{p:30,label:"不是當日第一次突破"},
  lowATR:{p:25,label:"ATR 未達門檻仍進場"}, midBox:{p:30,label:"在箱體中央進場"},
  heldPast10:{p:50,label:"10:00 沒有平掉"}
};

var STEPS = ["prep","atr","window","breakout","risk","orders","exit","review"];
var STEP_LABEL = {prep:"結構",atr:"波動",window:"時間",breakout:"突破",risk:"風險",orders:"掛單",exit:"出場",review:"結算"};

var EDGES = [
  {k:"prevHigh",l:"前日高",dir:"long"},
  {k:"boxHigh",l:"箱型上緣",dir:"long"},
  {k:"prevLow",l:"前日低",dir:"short"},
  {k:"boxLow",l:"箱型下緣",dir:"short"}
];

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,"0");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;});
  var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function r1(n){return Math.round(n*10)/10;}

function blankDraft(st){
  return {id:"t"+Date.now(),date:todayStr(),mode:"復盤",
    prevHigh:"",prevLow:"",boxHigh:"",boxLow:"",atr:"",
    dir:null,edge:"",edgePrice:"",entry:"",barRange:"",
    structSL:String(st.slPoints),
    orders:{entry:false,sl:false,tp:false,time:false},
    exitType:"",exitPrice:"",exitTime:"",mfePrice:"",maePrice:"",
    note:"",violations:[],outcome:null,skipReason:""};
}

function scoreOf(r){var s=100;(r.violations||[]).forEach(function(v){if(PENALTY[v])s-=PENALTY[v].p;});return Math.max(0,s);}
function pnlPoints(r){
  if(r.outcome!=="traded")return 0;
  var e=num(r.entry),x=num(r.exitPrice);
  if(e===null||x===null)return 0;
  return r1(r.dir==="long"?x-e:e-x);
}
function excursions(r){
  var e=num(r.entry),a=num(r.mfePrice),b=num(r.maePrice);
  if(e===null)return {mfe:null,mae:null};
  var s=r.dir==="long"?1:-1;
  return {mfe:a===null?null:Math.max(0,r1((a-e)*s)),mae:b===null?null:Math.max(0,r1((e-b)*s))};
}
function breakevenRate(sl,tp,cost,pv){
  var c=pv?cost/pv:0, d=tp+sl;
  return d>0?((sl+c)/d)*100:0;
}

/* ---------- state ---------- */
var S={settings:Object.assign({},DEFAULTS),records:[],view:"home",step:0,
  draft:blankDraft(DEFAULTS),chk:{c1:false,c2:false},csv:"",msg:"",err:"",imp:""};

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);
      S.settings=Object.assign({},DEFAULTS,d.settings||{});
      S.records=d.records||[];
      S.draft=blankDraft(S.settings);}
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({settings:S.settings,records:S.records}));S.err="";}
  catch(e){S.err="存不進去。去規則頁按「匯出備份」把資料複製出來。";}
}

/* ---------- render ---------- */
function render(){
  var a=document.activeElement;
  var fid=(a&&a.dataset&&a.dataset.field)?a.dataset.field:null;
  var pos=null;
  if(fid){try{pos=a.selectionStart;}catch(e){}}
  document.getElementById("app").innerHTML=viewAll();
  if(fid){
    var el=document.querySelector('[data-field="'+fid+'"]');
    if(el){el.focus();if(pos!==null){try{el.setSelectionRange(pos,pos);}catch(e){}}}
  }
}

function viewAll(){
  var h='<header class="top"><div class="brand"><span class="mark"></span><div>'+
    '<div class="btitle">開盤突破 SOP</div>'+
    '<div class="bsub">09:15–09:20 · 一天一局 · 第 '+(S.records.length+1)+' 局 / '+S.settings.target+'</div>'+
    '</div></div><nav class="tabs">';
  [["home","今日"],["stats","驗證"],["set","規則"]].forEach(function(t){
    h+='<button class="tab'+(S.view===t[0]?" on":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>';
  });
  h+='</nav></header>';
  if(S.err)h+='<div class="err">'+esc(S.err)+'</div>';
  var bs=backupStatus();
  if(bs.unsaved>=3||(bs.days!==null&&bs.days>=7&&S.records.length>0)){
    h+='<div class="nag"><span>'+
      (bs.unsaved>0?bs.unsaved+" 筆還沒備份":"上次備份是 "+bs.days+" 天前")+
      '。Safari 可能會清掉本機資料。</span>'+
      '<button data-act="dljson">下載備份</button></div>';
  }
  if(S.view==="home")h+=viewRun();
  if(S.view==="stats")h+=viewStats();
  if(S.view==="set")h+=viewSet();
  return h;
}

function card(k,t,s,body){
  return '<section class="card"><div class="ck">'+k+'</div><h2>'+t+'</h2><p class="sub">'+s+'</p>'+body+'</section>';
}
function fld(label,inner){return '<label class="field"><span>'+label+'</span>'+inner+'</label>';}
function inp(field,val,opts){
  opts=opts||{};
  return '<input data-field="'+field+'" data-scope="'+(opts.scope||"draft")+'" value="'+esc(val)+'"'+
    (opts.big?' class="big"':'')+(opts.ph?' placeholder="'+opts.ph+'"':'')+
    (opts.text?'':' inputmode="decimal"')+'>';
}
function kv(k,v){return '<div class="kv"><span>'+k+'</span><b class="mono">'+v+'</b></div>';}
function primary(act,label,extra){return '<button class="primary" data-act="'+act+'"'+(extra||"")+'>'+label+'</button>';}
function fork(reason,vios){
  return '<div class="choices">'+
    '<button class="ch" data-act="closeday" data-v="'+esc(reason)+'"><b>今日封盤</b><em>守規則，這局照樣算分</em></button>'+
    '<button class="ch warn" data-act="force" data-v="'+vios+'"><b>我還是要進</b><em>會記一筆違規</em></button></div>';
}

function viewRun(){
  var d=S.draft,st=S.settings,id=STEPS[S.step];
  var h='<main><ol class="gates">';
  STEPS.forEach(function(s,i){
    h+='<li class="gate'+(i===S.step?" now":"")+(i<S.step?" done":"")+'"'+
      (i<S.step?' data-act="gate" data-v="'+i+'"':'')+'>'+
      '<span class="gnum">'+(i+1)+'</span><span class="glab">'+STEP_LABEL[s]+'</span></li>';
  });
  h+='</ol>';

  var atr=num(d.atr),entry=num(d.entry),sl=num(d.structSL);
  var sign=d.dir==="long"?1:-1;
  var slPrice=(entry!==null&&sl!==null)?entry-sign*sl:null;
  var tpPrice=(entry!==null)?entry+sign*st.tpPoints:null;

  if(id==="prep"){
    var b=
      '<div class="row">'+fld("日期",inp("date",d.date,{text:1}))+
      fld("模式",'<div class="seg">'+["復盤","實盤"].map(function(m){
        return '<button data-act="mode" data-v="'+m+'" class="'+(d.mode===m?"on":"")+'">'+m+'</button>';}).join("")+'</div>')+
      '</div>'+
      '<div class="row">'+fld("前日高",inp("prevHigh",d.prevHigh))+fld("前日低",inp("prevLow",d.prevLow))+'</div>'+
      '<div class="row">'+fld("箱型上緣",inp("boxHigh",d.boxHigh))+fld("箱型下緣",inp("boxLow",d.boxLow))+'</div>'+
      primary("go","邊界確定",' data-v="1"');
    h+=card("01","盤前結構","先把今天要拿來判斷的邊界寫死。寫不出來的邊界，等一下不能當突破。",b);
  }

  if(id==="atr"){
    var b=fld("目前 ATR",inp("atr",d.atr,{big:1}));
    if(atr!==null){
      var ok=atr>=st.atrMin;
      b+='<div class="verdict '+(ok?"pass":"fail")+'">'+(ok?atr+" ≥ "+st.atrMin+"，波動夠。":atr+" < "+st.atrMin+"，波動不夠。")+'</div>';
      b+= ok?primary("go","下一關",' data-v="1"'):fork("ATR 未達門檻","lowATR");
    }
    h+=card("02","波動閘","ATR 低於 "+st.atrMin+" 就沒有 "+st.tpPoints+" 點可以走。這關過不了，今天不是你的盤。",b);
  }

  if(id==="window"){
    var b='<div class="clock"><span>09:15</span><div class="bar"></div><span>09:20</span></div>'+
      '<div class="choices">'+
      '<button class="ch" data-act="go" data-v="1"><b>09:20 前出現突破</b><em>繼續判定</em></button>'+
      '<button class="ch" data-act="closeday" data-v="09:20 前沒有突破"><b>沒有突破</b><em>今日封盤</em></button>'+
      '<button class="ch warn" data-act="force" data-v="lateEntry"><b>09:20 之後才想進</b><em>會記一筆違規</em></button>'+
      '</div>';
    h+=card("03","時間閘","09:15 開盤雜訊過後開始看。09:20 沒有突破，今天就結束了。",b);
  }

  if(id==="breakout"){

      b+='<div class="choices"><button class="ch warn" data-act="force" data-v="'+vs.join(",")+'">'+
        '<b>沒掛齊就進場了</b><em>會記違規，照實記</em></button></div>';
    }

  }

  if(id==="exit"){
    var ex=excursions(d);
    var b=fld("怎麼出的",'<div class="exits">'+
      [["tp","停利 +"+st.tpPoints,tpPrice],["sl","停損 −"+(sl===null?st.slPoints:sl),slPrice],["force","10:00 平倉",null]]
      .map(function(E){

    b+='<div class="row">'+fld("出場價",inp("exitPrice",d.exitPrice))+fld("出場時間",inp("exitTime",d.exitTime,{text:1,ph:"09:34"}))+'</div>';
    b+='<div class="sechead">持倉期間的極值（不是整天）</div>';
    b+='<div class="row">'+fld("最有利到的價",inp("mfePrice",d.mfePrice))+fld("最不利到的價",inp("maePrice",d.maePrice))+'</div>';
    if(ex.mfe!==null||ex.mae!==null){
      b+='<div class="exbox">'+
        '<div class="exc"><span>MFE 最大有利</span><b class="mono up">+'+(ex.mfe===null?"—":ex.mfe)+'</b></div>'+

function viewReview(){
  var d=S.draft,st=S.settings;
  var skip=d.outcome==="skip",score=scoreOf(d),pts=pnlPoints(d);
  var money=pts*st.pointValue-(skip?0:st.costPerRound);
  var ex=excursions(d),sl=num(d.structSL);
  var b='<div class="scorebox"><div class="sc"><span>紀律</span><b class="'+(score===100?"full":"cut")+'">'+score+'</b></div>';
  if(!skip)b+='<div class="sc"><span>結果（隨機）</span><b class="mono result">'+(pts>0?"+":"")+pts+' 點</b></div>';
  b+='</div>';
  if(skip&&score===100)b+='<div class="verdict pass">空手也是執行。這一局算完整走完。</div>';
  if(d.violations.length){
    b+='<div class="viols">'+d.violations.map(function(v){
      return '<div class="vi"><span>−'+PENALTY[v].p+'</span>'+PENALTY[v].label+'</div>';}).join("")+'</div>';
  }
  if(!skip){
    b+='<div class="rows">'+
      kv("淨損益",(money>0?"+":"")+money.toLocaleString()+" 元")+
      kv("MFE / MAE","+"+(ex.mfe===null?"—":ex.mfe)+" / −"+(ex.mae===null?"—":ex.mae)+" 點")+
      kv("用的停損",(sl===null?"—":sl)+" 點")+
      kv("持倉到",d.exitTime||"—")+'</div>';
    var sig=[];
    if(ex.mfe!==null&&ex.mfe>=st.tpPoints&&d.exitType==="tp")sig.push("MFE 達停利：方向抓對，停利設得早不早看 "+st.target+" 筆分佈");
    if(d.exitType==="sl"&&ex.mfe!==null&&ex.mfe>=st.tpPoints*0.5)sig.push("打停損前先賺過 "+ex.mfe+" 點：方向對，問題在保護機制");
    if(pts>0&&ex.mae!==null&&sl!==null&&ex.mae>sl*0.8)sig.push("贏家但逆行過 "+ex.mae+" 點，逼近停損 "+sl+"：停損再緊一點就殺掉這筆");
    if(d.exitType==="sl"&&ex.mfe!==null&&ex.mfe<10)sig.push("進場後幾乎沒賺過：可能是追價太遠或假突破");
    sig.forEach(function(s){b+='<div class="verdict pass">'+s+'</div>';});
  }
  b+=primary("commit","存進驗證表（第 "+(S.records.length+1)+" 筆）");
  return card("08",skip?"今日封盤":"結算",skip?esc(d.skipReason):"先看紀律，再看數字。",b);
}

/* ---------- stats ---------- */
function computeStats(){
  var st=S.settings;
  var traded=S.records.filter(function(r){return r.outcome==="traded";});
  var rows=traded.map(function(r){var e=excursions(r);return {r:r,p:pnlPoints(r),mfe:e.mfe,mae:e.mae};});
  var wins=rows.filter(function(x){return x.p>0;}),losses=rows.filter(function(x){return x.p<=0;});
  var totalPts=rows.reduce(function(a,x){return a+x.p;},0);
  var winMae=wins.map(function(x){return x.mae;}).filter(function(v){return v!==null;});
  var lossMfe=losses.map(function(x){return x.mfe;}).filter(function(v){return v!==null;});
  var tpRows=rows.filter(function(x){return x.r.exitType==="tp";});
  var flew=tpRows.filter(function(x){return x.mfe!==null&&x.mfe>st.tpPoints;});
  var maxLose=0,cur=0;
  rows.forEach(function(x){if(x.p<=0){cur++;if(cur>maxLose)maxLose=cur;}else cur=0;});
  var streak=0;
  for(var i=S.records.length-1;i>=0;i--){if(scoreOf(S.records[i])===100)streak++;else break;}
  var byEdge={};
  EDGES.forEach(function(e){
    var g=rows.filter(function(x){return x.r.edge===e.k;});
    if(g.length)byEdge[e.l]={n:g.length,w:g.filter(function(x){return x.p>0;}).length,
      pts:r1(g.reduce(function(a,x){return a+x.p;},0))};
  });
  var byExit={};
  [["tp","停利"],["sl","停損"],["force","10:00 平倉"]].forEach(function(E){
    var g=rows.filter(function(x){return x.r.exitType===E[0];});
    if(g.length)byExit[E[1]]={n:g.length,pts:r1(g.reduce(function(a,x){return a+x.p;},0))};
  });
  return {n:S.records.length,traded:traded.length,skipped:S.records.length-traded.length,
    winRate:rows.length?(wins.length/rows.length)*100:0,
    breakeven:breakevenRate(st.slPoints,st.tpPoints,st.costPerRound,st.pointValue),
    totalPts:r1(totalPts),net:totalPts*st.pointValue-traded.length*st.costPerRound,
    expectancy:rows.length?totalPts/rows.length:0,
    disc:S.records.length?S.records.reduce(function(a,r){return a+scoreOf(r);},0)/S.records.length:0,
    streak:streak,maxLose:maxLose,
    winMaeMed:median(winMae),winMaeMax:winMae.length?Math.max.apply(null,winMae):null,winMaeN:winMae.length,
    lossMfeMed:median(lossMfe),lossMfeMax:lossMfe.length?Math.max.apply(null,lossMfe):null,lossMfeN:lossMfe.length,
    flewN:flew.length,tpN:tpRows.length,flewMed:median(flew.map(function(x){return x.mfe;})),
    byEdge:byEdge,byExit:byExit};
}

function viewStats(){
  var s=computeStats(),st=S.settings,thin=s.traded<20;
  var h='<main>';
  h+='<section class="panel"><div class="ptitle">紀律</div>'+
    '<div class="bigstat"><b>'+s.disc.toFixed(0)+'</b><span>平均分</span></div><div class="rows">'+
    kv("連續滿分",s.streak+" 局")+kv("完成進度",s.n+" / "+st.target)+
    kv("出手 / 封盤",s.traded+" / "+s.skipped)+'</div></section>';

  h+='<section class="panel"><div class="ptitle">'+st.target+' 局驗證</div><div class="grid80">';
  for(var i=0;i<st.target;i++){
    var r=S.records[i],c="cell";
    if(r){
      c+= r.outcome==="skip"?" skip":(pnlPoints(r)>0?" win":" loss");
      if(scoreOf(r)<100)c+=" broke";
    }
    h+='<div class="'+c+'"></div>';
  }
  h+='</div><div class="legend"><i class="cell skip"></i>封盤<i class="cell win"></i>賺<i class="cell loss"></i>賠<i class="cell win broke"></i>有違規</div></section>';

  h+='<section class="panel accent"><div class="ptitle">停損校準</div>'+
    '<p class="pnote">把最後有賺的單子挑出來，看它們最多逆行過幾點。停損如果比這個數字小，你是在殺自己的贏家。</p><div class="rows">'+
    kv("贏家 MAE 中位數（"+s.winMaeN+" 筆）",s.winMaeMed===null?"—":s.winMaeMed+" 點")+
    kv("贏家 MAE 最大值",s.winMaeMax===null?"—":s.winMaeMax+" 點")+
    kv("目前停損設定",st.slPoints+" 點")+'</div>';
  if(s.winMaeMed!==null){
    var okSL=st.slPoints>s.winMaeMed;
    h+='<div class="verdict '+(okSL?"pass":"fail")+'">'+
      (okSL?"停損 "+st.slPoints+" 點蓋得住一半以上的贏家。"
          :"停損 "+st.slPoints+" 點小於贏家逆行中位數 "+s.winMaeMed+" 點——有一半的贏家會先被掃掉。")+
      (thin?" 樣本未滿 20 筆，只能當方向參考。":"")+'</div>';
  }
  h+='</section>';

  h+='<section class="panel accent"><div class="ptitle">停利校準</div>'+
    '<p class="pnote">停損出場的單子最多有利過幾點？如果常常先賺很多才回頭，問題不在方向，在保護。</p><div class="rows">'+
    kv("輸家 MFE 中位數（"+s.lossMfeN+" 筆）",s.lossMfeMed===null?"—":s.lossMfeMed+" 點")+
    kv("輸家 MFE 最大值",s.lossMfeMax===null?"—":s.lossMfeMax+" 點")+
    kv("停利成交筆數",s.tpN+" 筆")+
    kv("其中賣飛（MFE 超過停利）",s.flewN+" 筆")+
    kv("賣飛時 MFE 中位數",s.flewMed===null?"—":s.flewMed+" 點")+'</div></section>';

  h+='<section class="panel"><div class="ptitle">結果（不代表系統好壞）</div><div class="rows">'+
    kv("實際勝率",s.winRate.toFixed(0)+"%")+
    kv("打平所需勝率",s.breakeven.toFixed(0)+"%")+
    kv("每局期望值",s.expectancy.toFixed(1)+" 點")+
    kv("累計點數",(s.totalPts>0?"+":"")+s.totalPts)+
    kv("扣成本淨額",(s.net>0?"+":"")+s.net.toLocaleString()+" 元")+
    kv("最長連續不賺",s.maxLose+" 局")+'</div></section>';

  var ek=Object.keys(s.byEdge);
  if(ek.length){
    h+='<section class="panel"><div class="ptitle">依突破的邊界分群</div><div class="rows">';
    ek.forEach(function(l){var g=s.byEdge[l];
      h+=kv(l,g.n+" 筆 · 勝 "+g.w+" · "+(g.pts>0?"+":"")+g.pts+" 點");});
    h+='</div></section>';
  }
  var xk=Object.keys(s.byExit);
  if(xk.length){
    h+='<section class="panel"><div class="ptitle">依出場方式分群</div><div class="rows">';
    xk.forEach(function(l){var g=s.byExit[l];h+=kv(l,g.n+" 筆 · "+(g.pts>0?"+":"")+g.pts+" 點");});
    h+='</div></section>';
  }
  return h+'</main>';
}

function buildCsv(){
  var st=S.settings;
  var head="日期,模式,ATR,邊界,方向,邊界價,進場,追價,K棒振幅,停損點數,出場方式,出場價,出場時間,損益點,損益金額,MFE點,MAE點,紀律分,違規,備註";
  var lines=S.records.map(function(r){
    var p=pnlPoints(r),ex=excursions(r);
    var edge=EDGES.filter(function(e){return e.k===r.edge;})[0];
    var chase=(num(r.entry)!==null&&num(r.edgePrice)!==null)?Math.abs(num(r.entry)-num(r.edgePrice)):"";
    return [r.date,r.mode,r.atr,edge?edge.l:"",
      r.dir==="long"?"多":(r.dir==="short"?"空":""),
      r.edgePrice,r.entry,chase,r.barRange,r.structSL,
      r.outcome==="skip"?("封盤:"+r.skipReason):r.exitType,
      r.exitPrice,r.exitTime,
      r.outcome==="traded"?p:"",
      r.outcome==="traded"?(p*st.pointValue-st.costPerRound):"",
      ex.mfe===null?"":ex.mfe, ex.mae===null?"":ex.mae,
      scoreOf(r),(r.violations||[]).map(function(v){return PENALTY[v].label;}).join(" / "),
      (r.note||"").replace(/[,\n]/g," ")].join(",");
  });
  return [head].concat(lines).join("\n");
}

function copy(text,okMsg){
  S.csv=text;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){S.msg=okMsg;render();},
      function(){S.msg="複製失敗，直接從下面的框選取。";render();});
  }else{S.msg="直接從下面的框選取複製。";}
}

function download(text,filename,mime){
  try{
    var blob=new Blob(["\ufeff"+text],{type:(mime||"text/plain")+";charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
    return true;
  }catch(e){return false;}
}

function markBackup(){
  S.settings.lastBackup=Date.now();
  S.settings.lastBackupN=S.records.length;
  save();
}

function backupStatus(){
  var unsaved=S.records.length-(S.settings.lastBackupN||0);
  var days=S.settings.lastBackup?Math.floor((Date.now()-S.settings.lastBackup)/86400000):null;
  return {unsaved:unsaved,days:days};
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.field)return;
  var f=t.dataset.field,sc=t.dataset.scope;
  if(sc==="draft"){S.draft[f]=t.value;render();}
  else if(sc==="settings"){
    var v=f==="date"?t.value:num(t.value);
    S.settings[f]=(v===null?0:v);save();render();
  }else if(sc==="root"){S.imp=t.value;}
});

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,p=el.dataset.p,d=S.draft;

  if(a==="tab"){S.view=v;S.msg="";render();return;}
  if(a==="gate"){S.step=parseInt(v,10);render();return;}
  if(a==="go"){S.step=Math.min(STEPS.length-1,S.step+parseInt(v,10));render();return;}
  if(a==="mode"){d.mode=v;render();return;}
  if(a==="closeday"){d.outcome="skip";d.skipReason=v;S.step=STEPS.indexOf("review");render();return;}
  if(a==="force"){
    (v||"").split(",").filter(Boolean).forEach(function(x){
      if(d.violations.indexOf(x)<0)d.violations.push(x);});
    S.step=Math.min(STEPS.length-1,S.step+1);render();return;
  }
  if(a==="edge"){
    var E=EDGES.filter(function(x){return x.k===v;})[0];
    d.edge=v;d.dir=E.dir;d.edgePrice=d[v]||"";render();return;
  }
  if(a==="chk"){S.chk[v]=!S.chk[v];render();return;}
  if(a==="lock"){d.orders[v]=!d.orders[v];render();return;}
  if(a==="exit"){d.exitType=v;if(p)d.exitPrice=p;render();return;}
  if(a==="held"){
    var i=d.violations.indexOf("heldPast10");
    if(i>=0)d.violations.splice(i,1);else d.violations.push("heldPast10");
    render();return;
  }
  if(a==="commit"){
    d.outcome=d.outcome||"traded";d.slUsed=num(d.structSL);
    S.records.push(JSON.parse(JSON.stringify(d)));
    save();
    S.draft=blankDraft(S.settings);S.chk={c1:false,c2:false};S.step=0;S.view="home";
    render();return;
  }
  if(a==="contract"){S.settings.contract=v;S.settings.pointValue=parseFloat(p);save();render();return;}
  if(a==="timestop"){S.settings.timeStopMode=v;save();render();return;}
  if(a==="csv"){copy(buildCsv(),"已複製，可以貼進交易日誌了。");render();return;}
  if(a==="dljson"){
    var stamp=todayStr();
    var ok=download(JSON.stringify({settings:S.settings,records:S.records}),
      "breakout-sop-備份-"+stamp+".json","application/json");
    if(ok){markBackup();S.msg="已下載。存到 iCloud 雲碟就不會不見了。";}
    else{copy(JSON.stringify({settings:S.settings,records:S.records}),"下載不成，改用複製的。");}
    S.view="set";render();return;
  }
  if(a==="dlcsv"){
    var ok2=download(buildCsv(),"breakout-sop-"+todayStr()+".csv","text/csv");
    S.msg=ok2?"CSV 已下載。":"下載不成，用「複製 CSV」。";
    render();return;
  }
  if(a==="restore"){
    try{
      var o=JSON.parse(S.imp||"");
      if(!o||!o.records)throw new Error();
      S.settings=Object.assign({},DEFAULTS,o.settings||{});
      S.records=o.records;S.settings.lastBackupN=S.records.length;
      save();S.msg="已還原 "+S.records.length+" 筆。";S.imp="";
    }catch(err){S.msg="這段不是有效的備份 JSON。";}
    render();return;
  }
  if(a==="clear"){
    if(confirm("刪掉全部紀錄？先匯出備份再按。")){S.records=[];save();render();}
    return;
  }
});

load();
render();
</script>
</body>
</html>
